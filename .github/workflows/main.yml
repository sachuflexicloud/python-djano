name: Deploy Django via SSH with PM2 Script

on:
  push:
    branches:
      - ${{ secrets.MAIN_BRANCH }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH key
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
        chmod 600 private_key

    - name: Deploy to Remote Server
      run: |
        ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.WORK_DIR }}

          echo "Pulling latest code..."
          git pull origin ${{ secrets.MAIN_BRANCH }}

          echo "Activating virtual environment..."
          source venv/bin/activate

          echo "Installing dependencies..."
          pip install -r requirements.txt

          echo "Running Django migrations..."
          python manage.py migrate

          echo "Collecting static files..."
          python manage.py collectstatic --noinput

          echo "Restarting Django app via PM2..."
          pm2 delete project_name_process || true
          pm2 start project_name_process.sh --name project_name_process

          pm2 save
        EOF
