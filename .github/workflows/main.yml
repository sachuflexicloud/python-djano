on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key and known hosts
        run: |
          # Create SSH directory if it doesn't exist
          mkdir -p ~/.ssh
          
          # Install the SSH private key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add the SSH host to known_hosts to prevent host verification prompts
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          # SSH to the server, bypassing host key verification
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            git pull origin main
            pm2 restart /home/python/project_name_process.sh --name server || pm2 start /home/python/project_name_process.sh --name server
          EOF
