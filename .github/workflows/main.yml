 on:
  push:
    branches:
      - main
  workflow_dispatch:
  
 jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest
    
    steps:
    - name: install ssh keys
      # check this thread to understand why its needed:
      # https://stackoverflow.com/a/70447517
      run: |
        install -m 600 -D /dev/null ~/.ssh/id_rsa
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
        
    - name: Deploy to server via SSH
      run: |
       ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
       cd /home/python || exit 1
       chown -R python:python /home/python
       git fetch origin
       git reset --hard origin/main
       pm2 restart project_name_process || pm2 start /home/python/project_name_process.sh --name project_name_process
       EOF

     


          
   
